services:
  - type: web
    name: keremet-hotel
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: keremet-hotel-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DISPLAY_NAME
        value: Keremet Admin
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_SESSION_TTL_MINUTES
        value: "720"
      - key: ADMIN_PASSWORD_MIN_LENGTH
        value: "10"
      - key: ADMIN_LOGIN_ATTEMPTS
        value: "5"
      - key: ADMIN_LOGIN_WINDOW_MINUTES
        value: "15"
      - key: ADMIN_TELEGRAM_CHAT_ID
        sync: false

databases:
  - name: keremet-hotel-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: keremet_hotel
    user: keremet
